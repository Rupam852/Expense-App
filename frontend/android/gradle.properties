org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# Fix: Kotlin incremental cache corruption on Windows (Kotlin daemon file locking issue)
kotlin.incremental=false

# Gradle daemon can cause file locking on Windows — disable for stability
org.gradle.daemon=false

# Parallel builds for faster compilation
org.gradle.parallel=true
