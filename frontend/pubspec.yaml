name: expense_app
description: "A secure, offline-first expense tracker app with Groww-inspired UI."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Navigation & Icons
  cupertino_icons: ^1.0.6

  # Network & Data Storage
  http: ^1.2.1
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.0.0
  sqflite: ^2.3.2
  path: ^1.9.0
  path_provider: ^2.1.3

  # State Management
  provider: ^6.1.2

  # Modern UI & Graphs
  google_fonts: ^6.2.1
  fl_chart: ^0.66.0
  intl: ^0.19.0
  qr_flutter: ^4.1.0

  # Device Hardware Capabilities
  image_picker: ^1.0.7
  file_picker: ^8.0.0
  local_auth: ^2.2.0

  # Sharing & File Operations
  share_plus: ^9.0.0
  open_file_plus: ^3.4.1

  # Authentication
  firebase_core: ^2.27.0
  firebase_auth: ^4.17.8
  google_sign_in: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
